[workspace]
members = ["crates/depot", "crates/depot-api", "crates/depot-auth", "crates/depot-core", "crates/depot-store"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.91"

[workspace.dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = "0.3.55"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.0", features = ["v7"] }
url = "2.5.8"

[profile.release]
lto = "thin"
strip = "symbols"
