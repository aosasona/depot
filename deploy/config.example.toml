[server]
bind = "127.0.0.1:8080"

[database]
url = "sqlite:///var/lib/depot/depot.db"

[security]
public_origin = "https://depot.example.com"
master_key_file = "/etc/depot/master.key"

[domains]
# New projects automatically receive <project-slug>.apps.example.com.
default_suffix = "apps.example.com"

[worker]
workspace_root = "/var/lib/depot/workspaces"
static_root = "/var/lib/depot/static"
git_timeout_seconds = 120
docker_binary = "docker"
railpack_binary = "/usr/local/bin/railpack"
shell_socket = "/var/lib/depot/worker-shell.sock"
docker_timeout_seconds = 1800

[worker.caddy_agent]
address = "10.0.0.10:9080"
auth_token = "replace-with-the-same-agent-token"
timeout_seconds = 30

# Optional GitHub App integration. Create the App first, store both secrets as
# root-readable files, then uncomment this section.
# [github]
# app_id = 123456
# app_slug = "your-depot-app"
# private_key_file = "/etc/depot/github-app.pem"
# webhook_secret_file = "/etc/depot/github-webhook-secret"
